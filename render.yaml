services:
  - type: web
    name: medcode-backend
    env: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput"
    startCommand: "gunicorn medcode.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: DATABASE_URL
        value: postgresql://postgres:password_here@db.supabase.co/postgres
      - key: ALLOWED_HOSTS
        value: medcode-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://medcode-frontend.onrender.com
