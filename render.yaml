services:
  # Django Backend
  - type: web
    name: medcode-backend
    runtime: python
    rootDir: backend
    region: singapore
    plan: free

    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py collectstatic --noinput

    startCommand: gunicorn medcode.wsgi:application

    healthCheckPath: /api/health/

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      - key: DATABASE_URL
        sync: false

      - key: ALLOWED_HOSTS
        value: "medcode-backend.onrender.com,localhost,127.0.0.1"

      - key: CORS_ALLOWED_ORIGINS
        value: "https://medcode-frontend.onrender.com,http://localhost:5173"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://medcode-frontend.onrender.com,http://localhost:5173"

  # React Frontend
  - type: web
    name: medcode-frontend
    runtime: static
    rootDir: frontend

    buildCommand: npm ci && npm run build

    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        value: https://medcode-backend.onrender.com