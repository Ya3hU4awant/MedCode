services:
  # =========================
  # Django API
  # =========================
  - type: web
    runtime: python
    name: medcode-backend
    rootDir: backend
    region: singapore
    plan: free

    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn medcode.wsgi:application
    healthCheckPath: /api/health/

    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      # Your existing Supabase PostgreSQL database.
      # Enter the real value in Render; do NOT commit it here.
      - key: DATABASE_URL
        sync: false

      - key: ALLOWED_HOSTS
        value: "medcode-backend.onrender.com,localhost,127.0.0.1"

      # Change this if Render gives your frontend a different hostname
      # or if you later add a custom domain.
      - key: CORS_ALLOWED_ORIGINS
        value: "https://medcode-frontend.onrender.com,http://localhost:5173"

      - key: CSRF_TRUSTED_ORIGINS
        value: "https://medcode-frontend.onrender.com,http://localhost:5173"

  # =========================
  # React/Vite frontend
  # =========================
  - type: web
    runtime: static
    name: medcode-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: VITE_API_BASE_URL
        value: https://medcode-backend.onrender.com
